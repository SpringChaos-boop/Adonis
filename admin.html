<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Админ-панель — Горицвет</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f3ebdd">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="admin/admin.css">
</head>
<body>
<header class="admin-bar">
  <a class="admin-brand" href="index.html">Between Earth &amp; Sun<small>ADMIN · GORITSVET</small></a>
  <div class="admin-bar__right">
    <span class="badge" id="mode-badge">Локальный режим</span>
    <span class="badge badge--user" id="user-badge" hidden></span>
    <span class="status" id="status" role="status" aria-live="polite"></span>
    <button class="btn btn--ghost" id="btn-login" type="button" hidden>Войти</button>
    <button class="btn btn--ghost" id="btn-logout" type="button" hidden>Выйти</button>
  </div>
</header>

<main class="admin">
  <nav class="admin-nav" id="tabs" aria-label="Разделы редактирования"></nav>

  <div class="admin-center">
    <div class="issues" id="issues" role="status" hidden></div>
    <section class="admin-form" id="form" aria-label="Редактор"></section>
  </div>

  <aside class="admin-preview" aria-label="Предпросмотр">
    <div class="preview-head">
      <div class="preview-tabs">
        <button type="button" data-preview="profile" aria-current="true">Профиль</button>
        <button type="button" data-preview="gallery">Галерея</button>
      </div>
      <button type="button" class="btn btn--ghost" id="btn-reload">Обновить</button>
    </div>
    <div class="preview-frame">
      <iframe id="preview" title="Предпросмотр страницы"></iframe>
    </div>
  </aside>
</main>

<footer class="admin-foot">
  <button class="btn" id="btn-draft" type="button">Сохранить черновик</button>
  <button class="btn btn--primary" id="btn-cloud" type="button" hidden>Сохранить на сайт</button>
  <button class="btn" id="btn-download" type="button">Скачать content.json</button>
  <button class="btn" id="btn-import" type="button">Загрузить файл…</button>
  <input type="file" id="file-import" accept="application/json,.json" hidden>
  <button class="btn" id="btn-validate" type="button">Проверить</button>
  <button class="btn btn--ghost" id="btn-reset" type="button">Забыть черновик</button>
  <span class="foot-note" id="foot-note"></span>
</footer>

<div class="login" id="login" hidden>
  <form id="login-form">
    <h2>Вход в Supabase</h2>
    <p class="hint">Только владелец сайта. Пользователь создаётся в Supabase → Authentication → Users.</p>
    <label class="field">
      <span>E-mail</span>
      <input class="input" type="email" id="login-email" required autocomplete="username">
    </label>
    <label class="field">
      <span>Пароль</span>
      <input class="input" type="password" id="login-password" required autocomplete="current-password">
    </label>
    <p class="status status--error" id="login-error" hidden></p>
    <div class="login-actions">
      <button class="btn btn--primary" type="submit">Войти</button>
      <button class="btn" type="button" id="login-cancel">Отмена</button>
    </div>
  </form>
</div>

<script type="module" src="admin/app.js"></script>
</body>
</html>
